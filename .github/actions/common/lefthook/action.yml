name: lefthook
description: Runs Lefthook pre-commit hooks
inputs:
  token:
    description: GitHub token to use for authentication
    required: true

runs:
  using: composite
  steps:
    - id: get-branch
      if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null
      run: echo "branch=$(gh pr view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ inputs.token }}
      shell: bash

    - name: Checkout PR branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) && steps.get-branch.outputs.branch || github.head_ref }}

    - name: comment if triggered by comment
      if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null
      run: |
        url=$(gh pr comment "${{ github.event.issue.number }}" --body "Lefthook is running 🚀")
        echo "comment_url=${url}" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ inputs.token }}
      shell: bash

    - name: Set up pixi
      uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
      with:
        run-install: false

    - run: |
        mkdir lefthook
        cp $GITHUB_ACTION_PATH/lefthook.yaml ./lefthook.yaml
        cp $GITHUB_ACTION_PATH/pixi.toml ./lefthook/pixi.toml
        cp $GITHUB_ACTION_PATH/pixi.lock ./lefthook/pixi.lock
      shell: bash

    - name: lefthook
      run: pixi run --manifest-path ./lefthook/pixi.toml lefthook-run
      shell: bash

    - if: ${{!cancelled()}}
      run: |
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "❌ Lefthook modified files. Please run lefthook locally and commit the fixes."
          git --no-pager diff
          exit 1
        fi
      shell: bash

    - name: Auto commit fixes
      if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, 'lefthook') && !cancelled() }}
      run: |
        rm ./lefthook.yaml
        rm -rf ./lefthook

        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add -A
        COMMENT_BODY=""

        if ! git diff --cached --quiet; then
          if git commit -m "apply lefthook fixes"; then
            if git push; then
              COMMENT_BODY="**Lefthook finished**
        ✅ Fixes applied and pushed successfully."
            else
              COMMENT_BODY="**Lefthook finished**
        ⚠️ Fixes committed locally, but **push failed**."
            fi
          else
            COMMENT_BODY="**Lefthook finished**
        ❌ Failed to commit fixes."
          fi
        else
          COMMENT_BODY="**Lefthook finished**
        ✅️ No changes were required."
        fi

        # Always attempt to comment
        gh pr comment "${{ github.event.issue.number }}" --edit-last --body "${COMMENT_BODY}" || echo "Failed to comment on PR"
      env:
        GH_TOKEN: ${{ inputs.token }}
      shell: bash
