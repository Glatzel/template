[workspace]
channels = ["https://prefix.dev/glatzel", "conda-forge"]
platforms = ["linux-64"]

[feature.lefthook.tasks]
lefthook-run = "lefthook run pre-commit --all-files --no-auto-install"

[feature.lefthook.dependencies]
lefthook = "==2.2.2"

[feature.python.dependencies]
numpydoc = "==1.11.0"
python = "3.13.*"
ruff = "==0.17.5"

[feature.rust.dependencies]
cargo-shear = "==1.14.1"

[feature.misc.dependencies]
python = "3.13.*"
actionlint = "==1.7.12"
nodejs = "==26.13.1"
markdownlint-cli2 = "==0.24.1"
pre-commit-hooks = "==6.0.0"
tombi = "==1.11.2"
typos = "==1.52.2"

[feature.clang.dependencies]
clang-format = "==23.1.5"

[feature.dotnet.dependencies]
dotnet = "==10.0.401"
csharpier = "==1.3.0"

[environments]
lefthook = ["lefthook"]
python = ["python"]
rust = ["rust"]
misc = ["misc"]
clang = ["clang"]
dotnet = ["dotnet"]
