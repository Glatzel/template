name: setup rust
description: |
  Set up Rust toolchain with pixi.

  This action will auto setup pixi.

inputs:
  toolchain:
    description: Rust toolchain to install
    default: stable
    required: false
  components:
    description: Rust components to install
    default: ""
    required: false
  targets:
    description: Rust target to install
    default: ""
    required: false

runs:
  using: composite
  steps:
    - name: Set up pixi
      uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
      with:
        run-install: false

    - name: Install rustup-init (if missing)
      shell: pwsh
      run: |
        if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
          pixi global install -c https://prefix.dev/glatzel -c conda-forge rustup
        }

    - name: Install Rust toolchain
      shell: pwsh
      run: |
          rustup install ${{ inputs.toolchain }} --profile minimal
          rustup default ${{ inputs.toolchain }}

    - name: Install Rust components
      if: ${{ inputs.components != '' }}
      shell: pwsh
      run: rustup component add ${{ inputs.components }}

    - name: Install Rust targets
      if: ${{ inputs.targets != '' }}
      shell: pwsh
      run: rustup target add ${{ inputs.targets }}
