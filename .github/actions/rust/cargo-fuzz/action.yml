# This file is automatically synchronized from https://github.com/Glatzel/template

name: cargo fuzz
description: Run Rust fuzz test

inputs:
  working-directory:
    description: Working directory
    default: .
  target:
    description: fuzz target name
    required: true
  time:
    description: max fuzz test time
    required: false
    defualt: 300
  options:
    description: Options passed to cargo fuzz test
    required: false
  args:
    description: Additional arguments pass
    required: false

runs:
  using: composite
  steps:
    - name: Run fuzz tests
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $true

        if (Test-Path ./scripts/setup.ps1) { . ./scripts/setup.ps1 }

        cargo +nightly fuzz run ${{ inputs.options }} ${{ inputs.target }} -- -max_total_time=${{ input.time }} ${{inputs.args}}
