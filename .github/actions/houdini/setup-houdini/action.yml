name: setup houdini
description: Sets up Houdini for use in a GitHub Actions workflow
inputs:
  major:
    description: Houdini version major
    required: true
  minor:
    description: Houdini version minor
    required: true
  patch:
    description: Houdini version patch
    required: true
  platform:
    description: |
      The platform identifier for the build to install.
      Only used in online installation.
      (e.g. linux_x86_64_gcc6.3)
      https://www.sidefx.com/download/daily-builds
    required: false
  sidefx-client-id:
    description: "SideFX client ID"
    required: true
  sidefx-client-secret:
    description: "SideFX client secret"
    required: true
  offline:
    description: use offline installation
    required: true
runs:
  using: "composite"
  steps:
    - if: ${{inputs.offline!='true' && inputs.offline!='false'}}
      run: |
        echo "offline should be true or false"
        exit 1
      shell: bash
    - name: Set up pixi
      uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
      with:
        run-install: false

    - name: install houdini launcher
      run: |
        pixi global install -c https://prefix.dev/glatzel  -c conda-forge vinaya-cli houdini-launcher
        sudo env "PATH=$PATH" install_houdini_launcher houdini_launcher
      working-directory: /opt
      shell: bash
    - name: Check Houdini installation
      id: houdini_install_check
      run: |
          output=$(./houdini_launcher/bin/houdini_installer list)
          echo "$output"
          if echo "$output" | grep -q ".*Houdini.*${{ inputs.major }}\.${{ inputs.minor }}\.${{ inputs.patch }}.*YES" && \
            echo "$output" | grep -q ".*hserver.*${{ inputs.major }}\.${{ inputs.minor }}\.${{ inputs.patch }}.*YES"
          then
            echo "Houdini ${{ inputs.major }}.${{ inputs.minor }}.${{ inputs.patch }} is installed"
            echo "houdini_installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Houdini ${{ inputs.major }}.${{ inputs.minor }}.${{ inputs.patch }} is not installed"
          fi

          if echo "$output" | grep -q "/usr/lib/sesi.*License Server.*${{ inputs.major }}\.${{ inputs.minor }}\.${{ inputs.patch }}.*YES"; then
            echo "Houdini license server ${{ inputs.major }}.${{ inputs.minor }}.${{ inputs.patch }} is installed"
            echo "license_server_installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Houdini license server ${{ inputs.major }}.${{ inputs.minor }}.${{ inputs.patch }} is not installed"
          fi
      shell: bash
      working-directory: /opt

    - name: write setting file
      run: |
        sudo -E tee ./houdini_launcher/bin/setting.ini > /dev/null <<EOF
        client_id=$SIDEFX_CLIENT_ID
        client_secret=$SIDEFX_CLIENT_SECRET
        EOF
      env:
        SIDEFX_CLIENT_ID: ${{inputs.sidefx-client-id}}
        SIDEFX_CLIENT_SECRET: ${{inputs.sidefx-client-secret}}
      working-directory: /opt
      shell: bash

    - name: install houdini (online)
      if: ${{ inputs.offline=='false' &&  steps.houdini_install_check.outputs.houdini_installed  !='true'}}
      run: |
        sudo mkdir -p /usr/share/applications/
        sudo -E ./houdini_launcher/bin/houdini_installer uninstall ./hfs${{inputs.major}}.${{inputs.minor}}.${{inputs.patch}} || true
        sudo -E ./houdini_launcher/bin/houdini_installer \
          install \
          --accept-EULA SideFX-2021-10-13 \
          --settings-file ./houdini_launcher/bin/setting.ini \
          --product Houdini \
          --version ${{inputs.major}}.${{inputs.minor}}.${{inputs.patch}} \
          --platform ${{inputs.platform}}
      working-directory: /opt
      shell: bash

    - name: install houdini license server (online)
      if: ${{inputs.offline=='false' &&  steps.houdini_install_check.outputs.license_server_installed  !='true'}}
      run: |
        sudo -E ./houdini_launcher/bin/houdini_installer \
          install \
          --accept-EULA SideFX-2021-10-13 \
          --settings-file ./houdini_launcher/bin/setting.ini \
          --product "License Server" \
          --version ${{inputs.major}}.${{inputs.minor}}.${{inputs.patch}} \
          --platform ${{inputs.platform}}
      working-directory: /opt
      shell: bash

    - name: download houdini iso (offline)
      if: ${{inputs.offline=='true' && (steps.houdini_install_check.outputs.houdini_installed  !='true' || steps.houdini_install_check.outputs.license_server_installed !='true')}}
      id: download-houdini-installer
      run: |
        pixi global install aria2
        response=$(vinaya sidefx download.get-daily-build-download launcher-iso ${{inputs.major}}.${{inputs.minor}} ${{inputs.patch}} linux)
        filename=$(echo "$response" | jq -r '.filename')
        sudo env "PATH=$PATH" \
          aria2c -c -x16 -s16 \
          --all-proxy="$HTTPS_PROXY" \
          -d /opt/houdini-iso \
          -o "$filename" \
          $(echo "$response" | jq -r '.download_url')
        echo "installer-filename=$filename" >> "$GITHUB_OUTPUT"
      env:
        SIDEFX_CLIENT_ID: ${{inputs.sidefx-client-id}}
        SIDEFX_CLIENT_SECRET: ${{inputs.sidefx-client-secret}}
      shell: bash

    - name: install houdini (offline)
      if: ${{inputs.offline=='true'  &&  steps.houdini_install_check.outputs.houdini_installed  !='true'}}
      run: |
        sudo mkdir -p /usr/share/applications/
        if [ -d "./hfs${{inputs.major}}.${{inputs.minor}}.${{inputs.patch}}" ]; then
            exit 0
        fi
        sudo -E ./houdini_launcher/bin/houdini_installer \
          install \
          --accept-EULA SideFX-2021-10-13 \
          --product Houdini \
          --offline-installer "/opt/houdini-iso/${{ steps.download-houdini-installer.outputs.installer-filename }}"
      working-directory: /opt
      shell: bash

    - name: install houdini license server (offline)
      if: ${{inputs.offline=='true' &&  steps.houdini_install_check.outputs.license_server_installed !='true'}}
      run: |
        sudo -E ./houdini_launcher/bin/houdini_installer \
          install \
          --accept-EULA SideFX-2021-10-13 \
          --product "License Server" \
          --offline-installer "/opt/houdini-iso/${{ steps.download-houdini-installer.outputs.installer-filename }}"
      working-directory: /opt
      shell: bash

    - name: install info
      if: ${{ !cancelled() }}
      run: houdini_launcher/bin/houdini_installer list
      working-directory: /opt
      shell: bash

    - name: start sesinetd
      run: |
        sudo systemctl start sesinetd
        sleep 2
        for i in $(seq 1 30); do
          if curl -sf -o /dev/null -X POST http://127.0.0.1:1715/api \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data 'json=["cmd_ping",[],{}]'; then
            echo "sesinetd is up"
            sleep 2
            break
          fi
          echo "sesinetd not responding, attempting restart ($i/30)..."
          sudo systemctl restart sesinetd
          sleep 2
          if [ "$i" -eq 30 ]; then
            echo "sesinetd failed to start"
            cat /tmp/sesinetd.log
            exit 1
          fi
        done
      shell: bash

    - name: install license
      run: |
        server_name=$(hostname)
        server_code=$(/usr/lib/sesi/sesictrl print-server | grep '^SERVER' | awk '{print $3}')
        echo "server_name=$server_name"
        echo "server_code=$server_code"

        response=$(vinaya sidefx license.get_non_commercial_license \
          --version ${{inputs.major}}.${{inputs.minor}} \
          "$server_name" \
          "$server_code" \
          HOUDINI-NC)

        keys=$(echo "$response" | jq -r '.license_keys[]' 2>&1) || {
          echo "jq failed, response was:" >&2
          echo "$response" >&2
          exit 1
        }

        echo "$keys" | while read -r key; do
          sudo /usr/lib/sesi/sesictrl install -h localhost "$key"
        done
        /usr/lib/sesi/sesictrl print-server
        /usr/lib/sesi/sesictrl print-license
      env:
        SIDEFX_CLIENT_ID: ${{inputs.sidefx-client-id}}
        SIDEFX_CLIENT_SECRET: ${{inputs.sidefx-client-secret}}
      shell: bash

    - name: start hserver
      run: |
        set +e
        cd /opt/hfs${{inputs.major}}.${{inputs.minor}}.${{inputs.patch}}
        source ./houdini_setup
        cd -
        hserver -S localhost || true
        hserver || true
        for i in $(seq 1 30); do
          hserver -l || true
          if hserver -l 2>&1 | grep -q "Connected To:"; then
              echo "hserver connected to sesinetd"
              hserver -l
              exit 0
          fi
          echo "waiting..."
          sleep 1
        done
        hserver -l | grep -q "Connected To:" || { echo "hserver never connected"; exit 1; }
      shell: bash
