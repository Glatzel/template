name: ci

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lefthook:
    uses: ./.github/workflows/ci-lefthook.yml
    permissions:
      contents: write
      pull-requests: write
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pixi-environment: dev
            args: ./tests
          - args: ./tests --color=yes
          - foo: ""
    runs-on: ubuntu-slim
    steps:
      - parallel:
        - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
          with:
            fetch-depth: 0
            ref: main
        - name: Set up pixi
          uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
          with:
            run-install: false
      - uses: ./.github/actions/python/pytest.yml
        with:
          pixi-environment: ${{ matrix.pixi-environment }}
          working-directory: test/python
          args: ${{ matrix.args }}
